<!DOCTYPE html>

<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Villa La Meridiana – Piscina</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --t: #B84A0A; --td: #7A2A00; --gold: #D4880A;
  --gl: #F2C040; --cream: #FDF6EC; --cm: #F0E2CC;
  --brown: #4A2810; --text: #1E0E04;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
header{position:relative;background:#FDFAF5;padding:28px 24px 24px;text-align:center;border-bottom:1px solid rgba(184,74,10,.12)}
.wm{display:none}
.loc-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(184,74,10,.07);border:1px solid rgba(184,74,10,.15);border-radius:30px;padding:4px 13px;font-size:.64rem;font-weight:500;color:rgba(122,42,0,.65);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.hc{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.logo-inline{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.logo-inline svg{width:42px;height:42px;opacity:.82}
h1{font-family:‘Cormorant Garamond’,serif;font-size:clamp(1.6rem,5vw,2.8rem);font-weight:600;color:#5C2E0A;letter-spacing:3px;line-height:1}
.hdiv{width:40px;height:1px;background:linear-gradient(90deg,transparent,rgba(184,74,10,.35),transparent);margin:12px auto 10px}
.htag{font-size:.65rem;font-weight:400;color:rgba(92,46,10,.5);letter-spacing:3.5px;text-transform:uppercase}

/* ── CONTROLS ── */
.cw{position:sticky;top:0;z-index:300}
.cc{background:rgba(253,246,236,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:0 0 20px 20px;padding:15px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:center;box-shadow:0 8px 32px rgba(90,30,0,.16),0 1px 0 rgba(255,255,255,.8) inset;border:1px solid rgba(210,160,90,.2);border-top:none}
.cg{display:flex;flex-direction:column;gap:4px}
.cg label{font-size:.62rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(–t)}
.cg input,.cg select{border:1.5px solid var(–cm);border-radius:10px;padding:9px 13px;font-family:‘DM Sans’,sans-serif;font-size:.88rem;color:var(–text);background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;min-width:155px;cursor:pointer}
.cg input:focus,.cg select:focus{border-color:var(–t);box-shadow:0 0 0 3px rgba(184,74,10,.12)}
.pc{background:linear-gradient(135deg,var(–td),var(–t));color:#fff;padding:9px 24px;border-radius:30px;font-size:1.15rem;font-weight:600;letter-spacing:1px;box-shadow:0 4px 16px rgba(184,74,10,.4);white-space:nowrap;animation:pp 3s ease-in-out infinite}
@keyframes pp{0%,100%{box-shadow:0 4px 16px rgba(184,74,10,.4)}50%{box-shadow:0 4px 26px rgba(184,74,10,.65)}}
.ba{background:transparent;border:1.5px solid rgba(184,74,10,.35);color:var(–t);padding:9px 18px;border-radius:10px;font-family:‘DM Sans’,sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s}
.ba:hover{background:var(–t);color:#fff;border-color:var(–t);transform:translateY(-1px)}

/* ── LEGENDA ── */
.leg{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;padding:10px 20px;background:var(–cm);font-size:.73rem;font-weight:500;color:var(–brown);border-bottom:1px solid rgba(0,0,0,.06)}
.li{display:flex;align-items:center;gap:7px}
.ld{width:12px;height:12px;border-radius:50%;flex-shrink:0}

/* ── MAPPA ── */
.mw{padding:20px 16px 28px}
.mc{max-width:1000px;margin:0 auto;border-radius:20px;overflow:hidden;box-shadow:0 22px 64px rgba(60,20,0,.22),0 4px 12px rgba(0,0,0,.1);border:3px solid rgba(255,255,255,.28)}
#poolMap{width:100%;display:block}
@keyframes ws{0%,100%{opacity:.08;transform:translateX(-10px) skewX(-4deg)}50%{opacity:.18;transform:translateX(12px) skewX(4deg)}}
.ws1{animation:ws 4s ease-in-out infinite}
.ws2{animation:ws 6.5s ease-in-out 1.2s infinite}
.ug{transition:transform .18s cubic-bezier(.2,.8,.3,1);transform-box:fill-box;transform-origin:center 80%}
.ug:hover{transform:scale(1.2)}

/* ── TOOLTIP ── */
.tt{position:fixed;background:rgba(50,12,0,.92);color:#fff;padding:7px 13px;border-radius:10px;font-size:.76rem;font-family:‘DM Sans’,sans-serif;pointer-events:none;opacity:0;transition:opacity .16s;z-index:500;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.tt.show{opacity:1}

/* ── ADMIN ── */
.as{display:none;max-width:900px;margin:0 auto;padding:0 16px 48px}
.as.open{display:block}
.at{display:flex;justify-content:space-between;align-items:center;padding:24px 0 16px;border-bottom:2px solid var(–cm);margin-bottom:20px}
.at h2{font-family:‘Cormorant Garamond’,serif;font-size:1.9rem;color:var(–td)}
.ast{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sc{background:#fff;border-radius:14px;padding:14px 22px;border:1.5px solid var(–cm);box-shadow:0 2px 12px rgba(0,0,0,.06);transition:transform .2s}
.sc:hover{transform:translateY(-2px)}
.sc .v{font-family:‘Cormorant Garamond’,serif;font-size:1.8rem;color:var(–t);line-height:1}
.sc .l{font-size:.7rem;color:#aaa;margin-top:4px}
.dh{font-family:‘Cormorant Garamond’,serif;font-size:1.2rem;color:var(–td);font-weight:600;padding:16px 0 6px;border-bottom:1px solid var(–cm);margin-bottom:8px}
.bc{background:#fff;border-radius:12px;padding:13px 16px;margin-bottom:7px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.055);border-left:4px solid var(–t);transition:box-shadow .2s,transform .2s}
.bc:hover{box-shadow:0 4px 18px rgba(0,0,0,.1);transform:translateX(2px)}
.bc.mattina{border-left-color:var(–gold)}
.bc.pomeriggio{border-left-color:var(–t)}
.bc.giornata{border-left-color:var(–td)}
.bn{font-weight:600;font-size:.92rem}
.bd{font-size:.74rem;color:#aaa;margin-top:2px}
.bp{font-weight:700;color:var(–t);font-size:1.05rem;margin-left:auto}
.bdel{background:#FFF0F0;border:none;color:#C0392B;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.82rem;transition:background .2s}
.bdel:hover{background:#FFD5D5}
.emp{text-align:center;padding:50px 20px;color:#ccc;font-size:.88rem}

/* ── MODALI ── */
.ov{position:fixed;inset:0;background:rgba(10,4,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.open{opacity:1;pointer-events:all}
.mo{background:#fff;border-radius:28px 28px 0 0;padding:32px 28px 36px;width:100%;max-width:480px;box-shadow:0 -20px 60px rgba(0,0,0,.28);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.85,.3,1)}
.ov.open .mo{transform:translateY(0)}
.mo::before{content:’’;display:block;width:42px;height:4px;background:#DDD;border-radius:4px;margin:0 auto 24px}
.mo h2{font-family:‘Cormorant Garamond’,serif;font-size:1.7rem;color:var(–td);margin-bottom:2px}
.ms{font-size:.73rem;color:#aaa;letter-spacing:1px;text-transform:uppercase;margin-bottom:22px}
.fr{margin-bottom:13px}
.fr label{display:block;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(–t);margin-bottom:5px}
.fr input{width:100%;border:1.5px solid #EEE;border-radius:10px;padding:11px 14px;font-family:‘DM Sans’,sans-serif;font-size:.9rem;color:var(–text);background:#FAFAFA;outline:none;transition:border-color .2s,background .2s}
.fr input:focus{border-color:var(–t);background:#fff}
.pb{background:linear-gradient(135deg,#FFF8EE,#FFF0D8);border:1.5px solid #E8C080;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin:18px 0}
.pb .pl{font-size:.76rem;color:#999}
.pb .pn{font-size:.68rem;color:#bbb;margin-top:2px}
.pb .pa{font-size:1.7rem;font-weight:700;color:var(–td);font-family:‘Cormorant Garamond’,serif}
.bc2{width:100%;background:linear-gradient(135deg,var(–td),var(–t));color:#fff;border:none;padding:15px;border-radius:14px;font-family:‘DM Sans’,sans-serif;font-size:1rem;font-weight:600;cursor:pointer;letter-spacing:.3px;box-shadow:0 6px 20px rgba(184,74,10,.4);transition:all .2s}
.bc2:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(184,74,10,.5)}
.bc2:active{transform:translateY(0)}
.bcan{width:100%;background:none;border:1.5px solid #E0E0E0;color:#BBB;padding:12px;border-radius:14px;font-family:‘DM Sans’,sans-serif;font-size:.88rem;cursor:pointer;margin-top:10px;transition:all .2s}
.bcan:hover{border-color:#AAA;color:#666}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(–td);color:#fff;padding:13px 28px;border-radius:30px;font-size:.88rem;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.28);transition:transform .32s cubic-bezier(.2,.85,.3,1);z-index:3000;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:560px){h1{font-size:1.7rem}.cc{gap:10px;padding:14px}.cg input,.cg select{min-width:130px;font-size:.82rem}.mo{padding:28px 18px 32px}}
</style>

<script>
const CFG={supabaseUrl:'YOUR_SUPABASE_URL',supabaseKey:'YOUR_SUPABASE_ANON_KEY',adminPin:'1234',priceWeekday:10,priceWeekend:20};

const OMBRELLONI=[
  // FILA 1 sopra (y=100) — tutta larghezza
  {id:1,x:80,y:100,s:2},{id:2,x:165,y:80,s:2},{id:3,x:250,y:100,s:2},
  {id:4,x:350,y:80,s:2},{id:5,x:450,y:100,s:2},{id:6,x:535,y:80,s:2},{id:7,x:618,y:100,s:2},
  // FILA 2 sopra (y=185)
  {id:8,x:120,y:188,s:2},{id:9,x:210,y:188,s:2},{id:10,x:300,y:188,s:2},
  {id:11,x:400,y:188,s:2},{id:12,x:490,y:188,s:2},{id:13,x:578,y:188,s:2},
  // FILA 3 sopra (y=270)
  {id:14,x:80,y:272,s:1},{id:15,x:165,y:272,s:2},{id:16,x:250,y:272,s:2},
  {id:17,x:350,y:272,s:2},{id:18,x:450,y:272,s:2},{id:19,x:535,y:272,s:2},{id:20,x:618,y:272,s:1},
  // LATO SINISTRO della piscina (x<235)
  {id:21,x:80,y:380,s:1},{id:22,x:80,y:470,s:2},{id:23,x:80,y:560,s:2},
  {id:24,x:80,y:650,s:1},{id:25,x:155,y:420,s:1},{id:26,x:155,y:530,s:1},{id:27,x:155,y:630,s:1},
  // LATO DESTRO della piscina (x>465)
  {id:28,x:620,y:380,s:1},{id:29,x:620,y:470,s:2},{id:30,x:620,y:560,s:2},{id:31,x:620,y:650,s:1},
];

let bookings=[],selOmb=null,adminOpen=false;

document.addEventListener('DOMContentLoaded',()=>{
  const dp=document.getElementById('datePicker');
  dp.value=today(); dp.min=today();
  dp.addEventListener('change',()=>{updPrice();loadBk()});
  document.getElementById('slotPicker').addEventListener('change',()=>{updPrice();renderMap()});
  updPrice(); loadBk();
});

const today=()=>new Date().toISOString().split('T')[0];
const isWE=d=>{const w=new Date(d+'T12:00:00').getDay();return w===0||w===6};
const price=d=>isWE(d)?CFG.priceWeekend:CFG.priceWeekday;
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const slotLbl=s=>s==='mattina'?'Mattina 10:00–14:00':s==='pomeriggio'?'Pomeriggio 14:00–20:00':'Giornata Intera';

function updPrice(){
  const d=document.getElementById('datePicker').value;
  document.getElementById('priceChip').textContent=d?`€ ${price(d)}`:'€ –';
}

async function sbF(path,opts={}){
  const r=await fetch(CFG.supabaseUrl+path,{...opts,headers:{'apikey':CFG.supabaseKey,'Authorization':'Bearer '+CFG.supabaseKey,'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===204)return null;
  return r.json().catch(()=>null);
}

async function loadBk(){
  const d=document.getElementById('datePicker').value;
  if(!d)return;
  try{const data=await sbF(`/rest/v1/bookings?date=eq.${d}&select=*`);bookings=Array.isArray(data)?data:[];}catch(e){bookings=[];}
  renderMap();
}

async function loadAllBk(){
  try{const data=await sbF('/rest/v1/bookings?select=*&order=date.desc,created_at.desc');bookings=Array.isArray(data)?data:[];}catch(e){}
}

function ombSt(id){
  const d=document.getElementById('datePicker').value;
  const bk=bookings.filter(b=>b.ombrellone_id===id&&b.date===d);
  const m=bk.some(b=>b.slot==='mattina'||b.slot==='giornata');
  const p=bk.some(b=>b.slot==='pomeriggio'||b.slot==='giornata');
  if(m&&p)return'full';if(m)return'morning';if(p)return'afternoon';return'free';
}

function canBk(id){
  const slot=document.getElementById('slotPicker').value,st=ombSt(id);
  if(st==='full')return false;
  if(slot==='giornata'&&st!=='free')return false;
  if(slot==='mattina'&&st==='morning')return false;
  if(slot==='pomeriggio'&&st==='afternoon')return false;
  return true;
}

const NS='http://www.w3.org/2000/svg';
const mk=t=>document.createElementNS(NS,t);
const at=(el,a)=>{Object.entries(a).forEach(([k,v])=>el.setAttribute(k,v));return el};

const COL={
  free:{top:'#7B4A18',pole:'#4A2E10',sd:'#C8A060'},
  morning:{top:'#D4880A',pole:'#7A5000',sd:'#EECC50'},
  afternoon:{top:'#B84A0A',pole:'#7A3A00',sd:'#E88A44'},
  full:{top:'#3A3A3A',pole:'#1E1E1E',sd:'#888'},
};

const tt=document.getElementById('tt');

function drawOmb(o){
  const st=ombSt(o.id),bk=canBk(o.id),c=COL[st];
  const g=mk('g');
  at(g,{transform:`translate(${o.x},${o.y})`,class:'ug'});
  if(!bk)at(g,{opacity:'.48'});
  if(bk)g.style.cursor='pointer';

  // Ombra sul prato
  g.appendChild(at(mk('ellipse'),{cx:2,cy:10,rx:22,ry:8,fill:'rgba(0,0,0,.14)'}));

  // Sdraie con testina
  const sPos=o.s===1?[[-10,16]]:[[- 22,16],[8,16]];
  sPos.forEach(([sx,sy])=>{
    g.appendChild(at(mk('rect'),{x:sx,y:sy,width:16,height:7,rx:3,fill:c.sd}));
    g.appendChild(at(mk('circle'),{cx:sx+14,cy:sy+3.5,r:4,fill:c.sd,opacity:'.7'}));
  });

  // Palo
  g.appendChild(at(mk('rect'),{x:-2,y:-30,width:4,height:44,rx:2,fill:c.pole}));

  // Ombra cono
  g.appendChild(at(mk('ellipse'),{cx:2,cy:-27,rx:28,ry:13,fill:'rgba(0,0,0,.18)'}));

  // Ombrellone
  const top=at(mk('ellipse'),{cx:0,cy:-30,rx:28,ry:14,fill:c.top});
  g.appendChild(top);

  // Spicchi
  for(let i=-3;i<=3;i++)g.appendChild(at(mk('line'),{x1:i*7,y1:-43,x2:i*7,y2:-18,stroke:'rgba(255,255,255,.17)','stroke-width':1.3}));

  // Bordo
  g.appendChild(at(mk('ellipse'),{cx:0,cy:-30,rx:28,ry:14,fill:'none',stroke:'rgba(0,0,0,.2)','stroke-width':1.2}));

  // Highlight
  g.appendChild(at(mk('ellipse'),{cx:-6,cy:-34,rx:11,ry:4.5,fill:'rgba(255,255,255,.18)'}));

  // Numero
  const txt=at(mk('text'),{x:0,y:-25,'text-anchor':'middle',fill:'rgba(255,255,255,.96)','font-size':10,'font-family':'DM Sans,sans-serif','font-weight':'700'});
  txt.textContent=o.id;
  g.appendChild(txt);

  if(bk){
    g.addEventListener('click',()=>openBook(o));
    g.addEventListener('mouseenter',e=>{
      top.setAttribute('filter','url(#glow)');
      const stTxt=st==='free'?'✓ Disponibile':st==='morning'?'⚑ Mattina occupata':'⚑ Pomeriggio occupato';
      tt.textContent=`#${o.id} · ${o.s} sdraia${o.s>1?'e':''} · ${stTxt}`;
      tt.classList.add('show'); mvTT(e);
    });
    g.addEventListener('mousemove',mvTT);
    g.addEventListener('mouseleave',()=>{top.removeAttribute('filter');tt.classList.remove('show')});
  }
  return g;
}

function mvTT(e){tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-38)+'px'}

function renderMap(){
  const l=document.getElementById('layer');
  l.innerHTML='';
  OMBRELLONI.forEach(o=>l.appendChild(drawOmb(o)));
}

function openBook(o){
  const d=document.getElementById('datePicker').value,slot=document.getElementById('slotPicker').value;
  selOmb=o;
  document.getElementById('mTitle').textContent=`☂ Ombrellone #${o.id}`;
  document.getElementById('mSub').textContent=`${fmtD(d)} · ${slotLbl(slot)} · ${o.s} sdraia${o.s>1?'e':''}`;
  document.getElementById('mPrice').textContent=`€ ${price(d)}`;
  document.getElementById('mPriceNote').textContent=isWE(d)?'Tariffa weekend':'Tariffa feriale';
  ['fName','fPhone','fNotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('bookOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('fName').focus(),400);
}

function closeBook(){document.getElementById('bookOverlay').classList.remove('open');selOmb=null}

async function confirmBooking(){
  const name=document.getElementById('fName').value.trim();
  if(!name){toast('⚠️ Inserisci nome e cognome');return}
  const d=document.getElementById('datePicker').value,slot=document.getElementById('slotPicker').value;
  const row={date:d,slot,ombrellone_id:selOmb.id,guest_name:name,guest_phone:document.getElementById('fPhone').value.trim(),notes:document.getElementById('fNotes').value.trim(),price:price(d),created_at:new Date().toISOString()};
  try{
    const res=await sbF('/rest/v1/bookings',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(row)});
    const saved=Array.isArray(res)?res[0]:res;
    if(saved?.id){bookings.push(saved);toast('✅ Prenotazione confermata!')}else throw new Error();
  }catch(e){row.id=Date.now();bookings.push(row);toast('✅ Salvato (offline)')}
  closeBook();renderMap();if(adminOpen)renderAdmin();
}

function openAdmin(){document.getElementById('pinInput').value='';document.getElementById('pinOverlay').classList.add('open');setTimeout(()=>document.getElementById('pinInput').focus(),400)}
function closePin(){document.getElementById('pinOverlay').classList.remove('open')}

async function checkPin(){
  if(document.getElementById('pinInput').value===CFG.adminPin){
    closePin();await loadAllBk();adminOpen=true;renderAdmin();
    document.getElementById('adminSection').classList.add('open');
    document.getElementById('adminSection').scrollIntoView({behavior:'smooth'});
  }else{toast('❌ PIN non corretto');document.getElementById('pinInput').value=''}
}

function closeAdmin(){document.getElementById('adminSection').classList.remove('open');adminOpen=false}

function renderAdmin(){
  const total=bookings.length,incasso=bookings.reduce((s,b)=>s+(b.price||0),0),oggi=today(),tn=bookings.filter(b=>b.date===oggi).length;
  document.getElementById('adminStats').innerHTML=`
    <div class="sc"><div class="v">${total}</div><div class="l">Prenotazioni totali</div></div>
    <div class="sc"><div class="v">${tn}</div><div class="l">Oggi</div></div>
    <div class="sc"><div class="v">€${incasso}</div><div class="l">Incasso totale</div></div>`;
  const byDate={};bookings.forEach(b=>{(byDate[b.date]=byDate[b.date]||[]).push(b)});
  const list=document.getElementById('bookingsList');list.innerHTML='';
  if(!bookings.length){list.innerHTML='<div class="emp">Nessuna prenotazione trovata.</div>';return}
  Object.keys(byDate).sort().reverse().forEach(d=>{
    const h=document.createElement('div');h.className='dh';h.textContent=fmtD(d);list.appendChild(h);
    byDate[d].forEach(b=>{
      const card=document.createElement('div');card.className=`bc ${b.slot}`;
      card.innerHTML=`<div><div class="bn">☂ #${b.ombrellone_id} · ${b.guest_name}</div><div class="bd">${slotLbl(b.slot)}${b.guest_phone?' · 📞 '+b.guest_phone:''}${b.notes?' · '+b.notes:''}</div></div><div class="bp">€${b.price}</div><button class="bdel" onclick="delBk('${b.id}')">🗑</button>`;
      list.appendChild(card);
    });
  });
}

async function delBk(id){
  if(!confirm('Eliminare questa prenotazione?'))return;
  try{await sbF(`/rest/v1/bookings?id=eq.${id}`,{method:'DELETE'})}catch(e){}
  bookings=bookings.filter(b=>String(b.id)!==String(id));
  renderAdmin();renderMap();toast('🗑 Eliminata');
}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3200)}

['bookOverlay','pinOverlay'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    if(e.target.id===id)id==='bookOverlay'?closeBook():closePin();
  });
});
</script>

</body>
